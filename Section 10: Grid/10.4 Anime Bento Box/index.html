<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="grid-container">
      <div class="grid-items" style="grid-area: box-1">
        <img src="images/death.avif" alt="Death from Soul Eater" />
      </div>
      <div class="grid-items" style="grid-area: box-2">
        <img src="images/evan.jpg" alt="Soul Evan from Soul Eater" />
      </div>
      <div class="grid-items" style="grid-area: box-3">
        <img src="images/maka.webp" alt="Maka from Soul Eater" />
      </div>
      <div class="grid-items" style="grid-area: box-4">
        <img src="images/black-star.webp" alt="Black Star from Soul Eater" />
      </div>
      <div class="grid-items" style="grid-area: box-5">
        <img src="images/tsubaki.webp" alt="Tsubaki from Soul Eater" />
      </div>
      <div class="grid-items" style="grid-area: box-6">
        <img
          src="images/death-the-kid.webp"
          alt="Death the Kid from Soul Eater"
        />
      </div>
      <div class="grid-items" style="grid-area: box-7">
        <img src="images/patty.webp" alt="Patty from Soul Eater" />
      </div>
      <div class="grid-items" style="grid-area: box-8">
        <img src="images/liz.jpg" alt="Liz from Soul Eater" />
      </div>
    </div>
  </body>
</html>
