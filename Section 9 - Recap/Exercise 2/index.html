<!--
    The following exercises are from https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Test_your_skills/Flexbox
    Exercise 2: Flexbox 2

In this task, the list items are all different sizes, but we want them to be displayed as three equal-sized
columns, no matter the content in each item.

Bonus question: Can you now make the first item twice the size of the other items?
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font: 1.2em / 1.5 sans-serif;
      }
      ul {
        max-width: 750px;
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li {
        background-color: #4d7298;
        border: 2px solid #77a6b6;
        border-radius: 0.5em;
        color: white;
        padding: 0.5em;
      }

      ul {
        /* Add styles here */
        display: flex;
      }

      li {
        /* Add styles here */
        flex: 1;
      }

      .li_1 {
        flex-grow: 2;
      }
    </style>
  </head>
  <body>
    <ul>
      <li class="li_1">I am small</li>
      <li>I have more content than the very small item.</li>
      <li>
        I have lots of content. So much content that I don't know where it is
        all going to go. I'm glad that CSS is pretty good at dealing with
        situations where we end up with more words than expected!
      </li>
    </ul>
  </body>
</html>
